<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sir Jake Burger</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#030712;color:#f1f5f9;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:14px 16px;font-weight:800;font-size:18px;background:#1d4ed8}
header.k{background:#059669}header.b{background:#4338ca}
main{padding:14px;max-width:520px;margin:auto}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 14px;background:#2563eb;color:#fff;cursor:pointer}
button.g{background:#334155}button.r{background:#e11d48}button.e{background:#059669}
button:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#0f172a;border:1px solid #1e3a8a;border-radius:14px;padding:12px;margin-bottom:10px}
.item{text-align:left;background:#0f172a;border:1px solid #1e3a8a;display:block;width:100%}
.big{font-size:44px;font-weight:900;text-align:center;margin:10px 0}
input{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid #1e3a8a;background:#020617;color:#fff;margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:#94a3b8;font-size:13px}
.ring{animation:sh .16s infinite linear;background:#1d4ed8}
@keyframes sh{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px)}75%{transform:translate(4px,-2px)}}
.disc{width:240px;height:240px;border-radius:50%;margin:20px auto;border:5px solid #1e3a8a;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// ====== 1. PASTE YOUR FIREBASE CONFIG HERE ======
const firebaseConfig = {
  apiKey: "PASTE_HERE",
  authDomain: "PASTE_HERE",
  databaseURL: "PASTE_HERE",   // must be the Realtime Database URL
  projectId: "PASTE_HERE",
  appId: "PASTE_HERE"
};
// ================================================

const MENU = [
  ['burger','Sir Jake Burger',65,'🍔'],['cheese','Double Cheeseburger',99,'🧀'],
  ['bacon','Bacon Overload Burger',120,'🥓'],['chicken','Crispy Chicken Meal',95,'🍗'],
  ['spag','Pinoy Spaghetti',75,'🍝'],['fries','Golden Fries',45,'🍟'],
  ['c1','Combo A: Burger+Fries+Tea',135,'🍱'],['c2','Combo B: Chicken+Rice+Drink',125,'🍛'],
  ['c3','Combo C: Dbl Burger+Spag+Sundae',185,'👑'],['sundae','Choco Fudge Sundae',35,'🍨'],
  ['float','Coke Float',50,'🥤'],['tea','House Iced Tea',30,'🧋'],['water','Bottled Water',20,'💧']
];
const $ = s => document.querySelector(s);
const app = $('#app');
const role = location.hash.slice(1);
window.onhashchange = () => location.reload();

function home() {
  app.innerHTML = `<header>🍔 Sir Jake Burger</header><main>
  <p class="muted">Open this page on each phone and pick its job:</p>
  <a href="#kiosk"><button style="width:100%;margin-bottom:10px">1. Customer Kiosk</button></a>
  <a href="#kitchen"><button class="e" style="width:100%;margin-bottom:10px">2. Kitchen</button></a>
  <a href="#buzzer"><button style="width:100%;background:#4338ca">3. Buzzer</button></a></main>`;
}

if (firebaseConfig.apiKey === 'PASTE_HERE') {
  app.innerHTML = '<header>Setup needed</header><main><p>Paste your Firebase config into index.html first.</p></main>';
} else if (!['kiosk','kitchen','buzzer'].includes(role)) {
  home();
} else {
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  ({kiosk, kitchen, buzzer})[role](db);
}

// ---------- PHONE 1: KIOSK ----------
function kiosk(db) {
  let cart = {}, view = 'menu', pay = 'Cash', done = null, cash = '';
  const total = () => MENU.reduce((s,m) => s + m[2]*(cart[m[0]]||0), 0);
  const count = () => Object.values(cart).reduce((a,b) => a+b, 0);
  window.add = id => { cart[id] = (cart[id]||0)+1; draw(); };
  window.chg = (id,d) => { cart[id] = (cart[id]||0)+d; if (cart[id] <= 0) delete cart[id]; draw(); };
  window.go = v => { view = v; draw(); };
  window.setPay = p => { pay = p; draw(); };
  window.setCash = v => { cash = v; draw(); };
  window.send = () => {
    if (pay === 'Cash' && (+cash||0) < total()) return alert('Not enough cash. Total is ₱' + total());
    const items = MENU.filter(m => cart[m[0]]).map(m => cart[m[0]] + 'x ' + m[1]).join(', ');
    const t = total(), p = pay;
    db.ref('counter').transaction(n => (n||100)+1, (err, ok, snap) => {
      if (err || !ok) return alert('Could not send order. Check internet.');
      const num = snap.val();
      db.ref('orders').push({num, items, total:t, payment:p, status:'PREPARING', ts:Date.now()});
      done = num; cart = {}; cash = ''; view = 'done'; draw();
    });
  };
  function draw() {
    let h = '<header>🍔 Sir Jake Burger Kiosk</header><main>';
    if (view === 'menu') {
      h += '<div class="grid">' + MENU.map(m => `<button class="item" onclick="add('${m[0]}')">
        <div style="font-size:26px">${m[3]}</div><div style="font-size:13px">${m[1]}</div>
        <div style="color:#60a5fa">₱${m[2]} ${cart[m[0]] ? '· ×'+cart[m[0]] : ''}</div></button>`).join('') + '</div>' +
        `<button style="width:100%;margin-top:12px" onclick="go('cart')" ${count()?'':'disabled'}>View Cart (${count()}) · ₱${total()}</button>`;
    } else if (view === 'cart') {
      h += MENU.filter(m => cart[m[0]]).map(m => `<div class="card row"><div>${m[3]} ${m[1]}<div class="muted">₱${m[2]} × ${cart[m[0]]}</div></div>
        <div><button class="g" onclick="chg('${m[0]}',-1)">−</button> <button class="g" onclick="chg('${m[0]}',1)">+</button></div></div>`).join('') +
        `<div class="big">₱${total()}</div><div class="grid"><button class="g" onclick="go('menu')">← Add more</button>
        <button onclick="go('pay')" ${count()?'':'disabled'}>Pay →</button></div>`;
    } else if (view === 'pay') {
      h += `<div class="card" style="text-align:center">Amount due<div class="big">₱${total()}</div></div>
        <div class="grid"><button class="${pay==='Cash'?'':'g'}" onclick="setPay('Cash')">💵 Cash</button>
        <button class="${pay==='Cashless'?'':'g'}" onclick="setPay('Cashless')">📱 GCash/Card</button></div>`;
      if (pay === 'Cash') {
        const ch = (+cash||0) - total();
        h += `<input type="number" inputmode="numeric" placeholder="Cash tendered ₱" value="${cash}" oninput="cash=this.value;document.getElementById('chg').textContent=(+this.value-${total()}>=0?'₱'+(+this.value-${total()}):'Short')">
          <div class="muted">Change: <b id="chg">${ch>=0&&cash?'₱'+ch:'—'}</b></div>`;
      }
      h += `<button class="e" style="width:100%;margin-top:12px" onclick="send()">Confirm & Send Order 🚀</button>
        <button class="g" style="width:100%;margin-top:8px" onclick="go('cart')">Back</button>`;
    } else {
      h += `<div class="card" style="text-align:center"><p>Order sent to the kitchen!</p><div class="big">#${done}</div>
        <p>Please take <b>Buzzer #${done}</b> and wait for it to ring.</p></div>
        <button style="width:100%" onclick="cash='';go('menu')">New Order</button>`;
    }
    app.innerHTML = h + '</main>';
  }
  draw();
}

// ---------- PHONE 2: KITCHEN ----------
function kitchen(db) {
  window.setStatus = (k, s) => db.ref('orders/' + k + '/status').set(s);
  db.ref('orders').on('value', snap => {
    const list = Object.entries(snap.val() || {}).map(([k,v]) => ({k, ...v}))
      .filter(o => o.status !== 'CLAIMED').sort((a,b) => a.ts - b.ts);
    app.innerHTML = `<header class="k">👨‍🍳 Kitchen Display · ${list.length} active</header><main>` +
      (list.length ? list.map(o => `<div class="card" style="${o.status==='READY'?'border-color:#3b82f6':''}">
        <div class="row"><b style="font-size:20px">Order #${o.num}</b><span class="muted">${o.status}</span></div>
        <p>${o.items}</p><div class="muted">${o.payment} · ₱${o.total}</div>
        <div class="grid" style="margin-top:10px">
          <button onclick="setStatus('${o.k}','READY')" ${o.status==='READY'?'disabled':''}>🔔 Food Ready</button>
          <button class="e" onclick="setStatus('${o.k}','CLAIMED')">✅ Claimed</button></div></div>`).join('')
        : '<p class="muted">No active orders. Waiting for the kiosk…</p>') + '</main>';
  });
}

// ---------- PHONE 3: BUZZER ----------
function buzzer(db) {
  let num = null, status = 'WAITING', ringing = false, timer = null, ctx = null, started = null, lastStatus = '';
  window.startBuzzer = () => {
    num = +$('#bn').value;
    if (!num) return alert('Type your order number');
    ctx = new (window.AudioContext || window.webkitAudioContext)();  // unlocked by this tap
    if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {});
    db.ref('orders').on('value', snap => {
      const mine = Object.values(snap.val() || {}).filter(o => o.num === num).pop();
      status = mine ? mine.status : 'WAITING';
      if (status === 'READY' && lastStatus !== 'READY') ring();
      if (status !== 'READY') stopRing();
      lastStatus = status; draw();
    });
    draw();
  };
  function beep() {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square'; o.frequency.value = 2400; g.gain.value = 0.15;
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.15);
  }
  function ring() {
    ringing = true; started = Date.now();
    clearInterval(timer);
    timer = setInterval(() => {
      if (Date.now() - started > 30000) return stopRing();   // 30s auto shut-off
      beep(); if (navigator.vibrate) navigator.vibrate(250);
    }, 400);
    draw();
  }
  function stopRing() {
    ringing = false; clearInterval(timer);
    if (navigator.vibrate) navigator.vibrate(0);
    draw();
  }
  function draw() {
    if (!num) {
      app.innerHTML = `<header class="b">📟 Buzzer Disc</header><main><div class="card">
        <p>Enter the order number on your receipt:</p><input id="bn" type="number" inputmode="numeric" placeholder="e.g. 101">
        <button style="width:100%" onclick="startBuzzer()">Start Buzzer</button></div></main>`;
      return;
    }
    app.innerHTML = `<header class="b">📟 Buzzer Disc</header><main>
      <div class="disc ${ringing ? 'ring' : ''}"><div class="muted">Order</div><div class="big" style="margin:0">#${num}</div>
      <b>${ringing ? '🔔 ORDER READY!' : status === 'READY' ? 'Ready (silenced)' : status === 'WAITING' ? 'Waiting…' : 'Preparing…'}</b></div>
      ${ringing ? '<button class="r" style="width:100%" onclick="stopRing()">Stop</button>' : ''}
      <button class="g" style="width:100%;margin-top:10px" onclick="location.reload()">Change number</button></main>`;
  }
  window.stopRing = stopRing;
  draw();
}
</script>
</body>
</html>
